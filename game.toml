# TM4 Ultimate Edition (inSAMity mod V2.2, disc v4.31) on top of TwistedMetal4Recomp.
# Identity values come from tools/new_project_layout/probe_disc.py run on the
# mod's own BIN/CUE (./tm4u.sh probe). The mod enlarges the boot EXE, so
# text_size must match the mod's PS-X EXE header (0x63000, stock is 0x49800).

[game]
name = "TwistedMetal4Recomp"
id = "SCUS-94560"
players = 4
exe = "disc/SCUS_945.60"
disc = "disc/TM4_TM3_v4_31.cue"
load_address = "0x80010000"
entry_pc = "0x80010000"
text_size = "0x00063000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "TM4_TM3_v4_31_Track01.bin"
cue_name = "TM4_TM3_v4_31.cue"
boot_exe = "SCUS_945.60"
known_sizes = [413105280]
known_md5 = [
  "2008d15029fb068ab4f1a9bb5833c1c8",
]
known_sha1 = [
  "43a18e69edca3cd9ad0eb1a923ba03795e28131c",
]
known_crc32 = [
  "30bfaee7",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Retail BIOS this title is built against. One pin: it selects the address
# model the BIOS is recompiled under, the filename a supplied dump is staged
# as, the profile Generate regenerates, and the backend linked into the build.
# Absent = SCPH-1001. OpenBIOS still links alongside as the default for a
# player with no dump of their own.
bios_config = "psxrecomp/bios/SCPH1001.toml"

[runtime]
window_title = "TM4 Ultimate Edition Recompiled"
memcard_dir = "saves"
# Enable the overlay loader: the shipped static shard / bundled overlay
# toolchain turn streamed overlays native instead of running them interpreted.
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
multitap_analog = true
[netplay]
require_cue = true
required_tracks = 33
required_disc_fp = "4716770bf3625e4f7cf8c6381e21c9c0f2beb7e72555b241b6c8d5f7dcbe33a4"

# CPU overclock. The mod does more work per frame than the PS1 CPU can, so
# big fights drop to 10-12 FPS at stock speed (Crazy 8 vs 7 CPU cars); in
# DuckStation it needs an overclock too. Measured in game time: 2x gives about
# 20 FPS there and 3x about 26-30. Every arena, car and mode now runs as
# native code (generated/overlays_static.tar.xz), so the overclock no longer
# multiplies interpreter work. The Steam Deck runs that fight at about 94% of
# real time at 2x and 70% at 3x, so 2x it is.
#
# Only in matches: outside them the game just waits (logos, the intro movie,
# menus), and 2x made those waits cost twice the host time, so the intro ran
# slow on the Deck. 0x8004FFD0 is 2 in every match (deathmatch, tournament,
# 2 players, bonus stages, the mod's 60 FPS mode, also while paused), 1 in
# the logos, menus and loading, and 0x48 in the movies.
[timing]
guest_cycle_scale = 2
guest_cycle_scale_gate = { addr = 0x8004FFD0, size = 1, value = 2 }
