# TM4 Ultimate Edition (inSAMity mod, v4.19) on top of TwistedMetal4Recomp.
# Identity values come from tools/new_project_layout/probe_disc.py run on the
# mod's own BIN/CUE (./tm4u.sh probe). The mod enlarges the boot EXE, so
# text_size must match the mod's PS-X EXE header (0x61800, stock is 0x49800).

[game]
name = "TwistedMetal4Recomp"
id = "SCUS-94560"
players = 4
exe = "disc/SCUS_945.60"
disc = "disc/TM4_TM3_v4_19.cue"
load_address = "0x80010000"
entry_pc = "0x80010000"
text_size = "0x00061800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "TM4_TM3_v4_19_Track01.bin"
cue_name = "TM4_TM3_v4_19.cue"
boot_exe = "SCUS_945.60"
known_sizes = [413051184]
known_md5 = [
  "23cf8ffac1a34f4ea5c7b9eb2276a230",
]
known_sha1 = [
  "80b5e6fb3f2f7cb0861f05145fd99351bb93469e",
]
known_crc32 = [
  "c786e8c9",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Retail BIOS this title is built against. One pin: it selects the address
# model the BIOS is recompiled under, the filename a supplied dump is staged
# as, the profile Generate regenerates, and the backend linked into the build.
# Absent = SCPH-1001. OpenBIOS still links alongside as the default for a
# player with no dump of their own.
bios_config = "psxrecomp/bios/SCPH1001.toml"

[runtime]
window_title = "TM4 Ultimate Edition Recompiled"
memcard_dir = "saves"
# Enable the overlay loader: the shipped static shard / bundled overlay
# toolchain turn streamed overlays native instead of running them interpreted.
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
multitap_analog = true
[netplay]
require_cue = true
required_tracks = 33
required_disc_fp = "ae4b1cd6118cabd37864a3b437ce4c701b8317add8febd52b7b7e9b56e21e268"

# The mod's 45/60 FPS modes need a CPU overclock (200-250% in DuckStation).
# 3 = each instruction costs 1/3 of its hardware time; VBlank keeps real time.
# Override for testing with PSX_GUEST_CYCLE_SCALE=<n>.
[timing]
guest_cycle_scale = 3
